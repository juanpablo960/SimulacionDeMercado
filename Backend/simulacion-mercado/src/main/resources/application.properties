# ============================================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ============================================================
spring.application.name=simulacion-mercado

# Puerto del servidor web (por defecto es 8080)
server.port=8080

# ============================================================
# CONFIGURACIÓN DE POSTGRESQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/simulacion_db
spring.datasource.username=postgres
spring.datasource.password=12345j

# ============================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# CONFIGURACIÓN DE THYMELEAF (para las vistas HTML)
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html